
{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="mb-4">
        <h1>Editar cliente</h1>
        <p class="text-muted">Atualize as informações cadastrais da cliente.</p>
    </div>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <div class="alert alert-{{ categoria }}" role="alert">
                {{ mensagem }}
            </div>
        {% endfor %}
    {% endwith %}

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST"
                  action="{{ url_for('main.editar_cliente', id_cliente=cliente.id_cliente) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome *</label>
                    <input type="text"
                           class="form-control"
                           id="nome"
                           name="nome"
                           maxlength="100"
                           value="{{ cliente.nome }}"
                           autocomplete="name"
                           required>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone *</label>
                    <input type="tel"
                           class="form-control"
                           id="telefone"
                           name="telefone"
                           maxlength="20"
                           value="{{ cliente.telefone }}"
                           autocomplete="tel"
                           required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           maxlength="120"
                           value="{{ cliente.email or '' }}"
                           autocomplete="email">
                </div>

                <button type="submit" class="btn btn-primary">
                    Salvar alterações
                </button>

                <a href="{{ url_for('main.clientes') }}"
                   class="btn btn-outline-secondary">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
