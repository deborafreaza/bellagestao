
{% extends "base.html" %}

{% block title %}{{ titulo }} | BellaGestão{% endblock %}

{% block content %}
<div class="container py-4">

    <a href="{{ url_for('main.home') }}"
       class="btn btn-outline-secondary mb-4">
        Voltar ao início
    </a>

    <h1 class="fw-bold">{{ titulo }}</h1>

    <p class="lead">{{ descricao }}</p>

    <div class="alert alert-info mt-4" role="status">
        Módulo {{ titulo }} do BellaGestão.
        A funcionalidade está em desenvolvimento.
    </div>

</div>
{% endblock %}
