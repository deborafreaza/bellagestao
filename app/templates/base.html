
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BellaGestão{% endblock %}</title>

    <style>
        :root {
            --primary: #8b5268;
            --secondary: #f8edf1;
            --background: #fffafc;
            --text: #382d33;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            font-size: 16px;
        }

        header {
            background: var(--white);
            padding: 20px 5%;
            border-bottom: 1px solid #eadce2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand {
            color: var(--primary);
            font-size: 26px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 13px;
            color: #806d76;
            margin-top: 4px;
        }

        nav {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        nav a:hover,
        nav a:focus {
            color: var(--primary);
            text-decoration: underline;
        }

        main {
            padding: 35px 5%;
            min-height: 70vh;
        }

        .content {
            max-width: 1100px;
            margin: auto;
        }

        .accessibility {
            background: var(--secondary);
            padding: 12px 5%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 6px;
            padding: 9px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover,
        button:focus {
            background: #66394c;
            outline: 3px solid #d7a9bb;
        }

        footer {
            text-align: center;
            padding: 22px;
            background: var(--white);
            border-top: 1px solid #eadce2;
            color: #806d76;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }

            nav {
                gap: 12px;
            }

            .accessibility {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <div class="brand">BellaGestão</div>
            <div class="subtitle">Sistema de gestão do Salão Distak</div>
        </div>

        <nav aria-label="Menu principal">
            <a href="/">Início</a>
            <a href="#clientes">Clientes</a>
            <a href="#profissionais">Profissionais</a>
            <a href="#servicos">Serviços</a>
            <a href="#agendamentos">Agendamentos</a>
        </nav>
    </header>

    <section class="accessibility" aria-label="Recursos de acessibilidade">
        <span>Acessibilidade: tamanho da fonte</span>
        <button type="button" onclick="alterarFonte(1)">
            A+
        </button>
        <button type="button" onclick="alterarFonte(-1)">
            A-
        </button>
        <button type="button" onclick="resetarFonte()">
            Padrão
        </button>
    </section>

    <main>
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer>
        BellaGestão | Salão Distak
        <br>
        Sistema de gerenciamento de agendamentos
    </footer>

    <script>
        let tamanhoFonte = 16;

        function alterarFonte(valor) {
            tamanhoFonte += valor * 2;

            if (tamanhoFonte < 12) tamanhoFonte = 12;
            if (tamanhoFonte > 26) tamanhoFonte = 26;

            document.body.style.fontSize = tamanhoFonte + "px";
        }

        function resetarFonte() {
            tamanhoFonte = 16;
            document.body.style.fontSize = "16px";
        }
    </script>

</body>
</html>
