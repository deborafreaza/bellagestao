
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BellaGestão{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f5f8;
            color: #302735;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #663b63;
        }

        .navbar-brand, .navbar-text {
            color: white !important;
        }

        .main-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,.07);
        }

        .btn-primary {
            background: #663b63;
            border-color: #663b63;
        }

        .btn-primary:hover {
            background: #4d2c4b;
        }

        /* Destaque visual para navegação por teclado */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #e09b32;
            outline-offset: 3px;
        }

        .accessibility-toolbar {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px 15px;
        }

        .accessibility-toolbar button {
            min-width: 42px;
            font-weight: bold;
        }

        .skip-link {
            position: absolute;
            left: -9999px;
            top: 10px;
            background: white;
            color: #302735;
            padding: 10px;
            z-index: 2000;
        }

        .skip-link:focus {
            left: 10px;
        }
    </style>
</head>

<body>
    <a href="#conteudo" class="skip-link">
        Pular para o conteúdo principal
    </a>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">BellaGestão</a>
            <span class="navbar-text">Salão Distak</span>
        </div>
    </nav>

    <main class="container py-5" id="conteudo">

        <!-- Ferramenta de acessibilidade: ajuste de fonte -->
        <div class="accessibility-toolbar d-flex justify-content-end align-items-center gap-2 mb-4"
             role="group"
             aria-label="Controles de acessibilidade">

            <span class="me-2">Tamanho da fonte:</span>

            <button type="button"
                    class="btn btn-outline-secondary"
                    id="diminuirFonte"
                    aria-label="Diminuir tamanho da fonte">
                A−
            </button>

            <button type="button"
                    class="btn btn-outline-secondary"
                    id="aumentarFonte"
                    aria-label="Aumentar tamanho da fonte">
                A+
            </button>

            <span id="statusFonte"
                  class="visually-hidden"
                  aria-live="polite">
                Tamanho da fonte padrão: 16 pixels.
            </span>
        </div>

        {% block content %}{% endblock %}
    </main>

    <script>
        (function () {
            let tamanhoFonte = 16;

            const tamanhoMinimo = 14;
            const tamanhoMaximo = 22;
            const passo = 2;

            const botaoAumentar = document.getElementById("aumentarFonte");
            const botaoDiminuir = document.getElementById("diminuirFonte");
            const statusFonte = document.getElementById("statusFonte");

            function atualizarFonte() {
                document.documentElement.style.fontSize = tamanhoFonte + "px";

                statusFonte.textContent =
                    "Tamanho da fonte: " + tamanhoFonte + " pixels.";

                botaoDiminuir.disabled = tamanhoFonte <= tamanhoMinimo;
                botaoAumentar.disabled = tamanhoFonte >= tamanhoMaximo;
            }

            botaoAumentar.addEventListener("click", function () {
                if (tamanhoFonte < tamanhoMaximo) {
                    tamanhoFonte += passo;
                    atualizarFonte();
                }
            });

            botaoDiminuir.addEventListener("click", function () {
                if (tamanhoFonte > tamanhoMinimo) {
                    tamanhoFonte -= passo;
                    atualizarFonte();
                }
            });

            atualizarFonte();
        })();
    </script>
</body>
</html>
