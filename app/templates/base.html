
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BellaGestão{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f5f8;
            color: #302735;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background: #663b63;
        }
        .navbar-brand, .navbar-text {
            color: white !important;
        }
        .main-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,.07);
        }
        .btn-primary {
            background: #663b63;
            border-color: #663b63;
        }
        .btn-primary:hover {
            background: #4d2c4b;
        }
        a:focus, button:focus {
            outline: 3px solid #e09b32;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">BellaGestão</a>
            <span class="navbar-text">Salão Distak</span>
        </div>
    </nav>

    <main class="container py-5" id="conteudo">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
